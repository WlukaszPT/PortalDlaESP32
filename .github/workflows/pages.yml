# Publikuje folder web/ na GitHub Pages po każdej zmianie na main.
name: Strona na GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Numer wersji w adresach plików, żeby przeglądarka nie trzymała starego app.js po aktualizacji.
      - name: Wersja plików
        run: |
          V="${GITHUB_SHA::8}"
          sed -i "s#css/style.css\"#css/style.css?v=$V\"#; s#js/app.js\"#js/app.js?v=$V\"#" web/index.html
          sed -i "s#'./config.js'#'./config.js?v=$V'#; s#'./icons.js'#'./icons.js?v=$V'#" web/js/app.js
          grep -n "?v=" web/index.html web/js/app.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
